<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1" name="viewport"/>
<meta content="noindex,nofollow" name="robots"/>
<title>Forms | Booked Out Solutions</title>
</head>
<body>
<!-- Static copies of the site forms so the host finds them when the site is published. Not linked from any page. -->
<form data-netlify="true" hidden="" method="POST" name="free-report" netlify-honeypot="bot-field">
<input name="form-name" type="hidden" value="free-report"/><input name="subject" type="hidden"/><input name="page" type="hidden"/>
<input name="first_name" type="text"/><input name="business_name" type="text"/><input name="email" type="email"/><input name="phone" type="tel"/>
<select name="trade"><option>Heating and air</option><option>Plumbing</option><option>Electrical</option><option>Something else</option></select>
<input name="town" type="text"/><textarea name="note"></textarea>
<select name="revenue"><option value="">Pick one</option><option>Under $250K</option><option>$250K to $500K</option><option>$500K to $1M</option><option>$1M to $3M</option><option>Over $3M</option><option>Rather not say</option></select>
<input name="consent" type="checkbox" value="yes"/><input name="bot-field" type="text"/>
</form>
<form data-netlify="true" hidden="" method="POST" name="bo-alert">
<input name="form-name" type="hidden" value="bo-alert"/><input name="subject" type="text"/><textarea name="message"></textarea>
</form>
<p>Nothing to see here. <a href="/">Go to the home page</a>.</p>
</body>
</html>
